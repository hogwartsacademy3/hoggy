        let currentExam = null;
        let isExamSubmitted = false;

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');
        const navMenu = document.getElementById('nav-menu');
        
        const welcomeScreen = document.getElementById('welcome-screen');
        const examContainer = document.getElementById('exam-container');
        const questionsContainer = document.getElementById('questions-container');
        const examForm = document.getElementById('exam-form');
        const scoreDisplay = document.getElementById('score-display');
        const submitBtn = examForm.querySelector('button[type="submit"]');

        function initNavigation() {
            // Group exams by grade
            const grades = {};
            examDatabase.forEach(exam => {
                if (!grades[exam.grade]) grades[exam.grade] = [];
                grades[exam.grade].push(exam);
            });

            // Generate HTML for menu
            let menuHTML = '';
            
            // Sort grades to ensure Grade 2 comes before Grade 3
            Object.keys(grades).sort().forEach(gradeNum => {
                menuHTML += `
                    <div class="mb-6">
                        <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-3 ml-2">Grade ${gradeNum}</h3>
                        <ul class="space-y-1">
                `;
                
                grades[gradeNum].forEach(exam => {
                    menuHTML += `
                        <li>
                            <button onclick="loadExam('${exam.id}')" class="w-full text-left px-4 py-3 rounded-lg text-gray-200 hover:bg-magic-700 hover:text-magic-gold transition-colors flex items-center gap-3">
                                <svg class="w-4 h-4 text-magic-gold/70" fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path></svg>
                                <span class="font-heading">${exam.subject}</span>
                            </button>
                        </li>
                    `;
                });
                
                menuHTML += `</ul></div>`;
            });
            
            navMenu.innerHTML = menuHTML;
        }

        function toggleMenu() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                // Small delay to allow display:block to apply before changing opacity
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300); // match duration
            }
        }

        menuBtn.addEventListener('click', toggleMenu);
        closeBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        function loadExam(examId) {
            currentExam = examDatabase.find(e => e.id === examId);
            if (!currentExam) return;

            // Reset states
            isExamSubmitted = false;
            scoreDisplay.classList.add('hidden');
            submitBtn.classList.remove('hidden');
            examForm.reset();

            // Update UI headers
            document.getElementById('exam-grade-badge').innerText = `GRADE ${currentExam.grade}`;
            document.getElementById('exam-subject-title').innerText = currentExam.subject;
            document.getElementById('exam-professor-name').innerText = currentExam.professor;

            // Generate Questions
            let questionsHTML = '';
            const labels = ['A', 'B', 'C', 'D'];

            currentExam.questions.forEach((q, index) => {
                questionsHTML += `
                    <div class="bg-magic-800/60 p-6 rounded-xl border border-magic-gold/20 shadow-lg relative z-10" id="question-card-${index}">
                        <div class="flex gap-4 mb-4">
                            <span class="font-heading text-xl text-magic-gold font-bold">${index + 1}.</span>
                            <h3 class="text-xl text-gray-100 leading-relaxed">${q.text.replace(/\n/g, '<br>')}</h3>
                        </div>
                        <div class="space-y-3 pl-8 sm:pl-10">
                `;

                q.options.forEach((opt, optIndex) => {
                    questionsHTML += `
                            <label class="block cursor-pointer relative group">
                                <input type="radio" name="q_${index}" value="${optIndex}" class="peer sr-only radio-custom" required>
                                <div class="flex items-start gap-4 p-4 rounded-lg border border-magic-700 hover:border-magic-gold/50 hover:bg-magic-700/50 transition-all">
                                    <div class="indicator mt-1 w-5 h-5 rounded-full border-2 border-gray-500 flex-shrink-0 flex items-center justify-center transition-colors">
                                        <!-- Custom radio dot -->
                                        <div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
                                    </div>
                                    <div class="flex gap-2 text-gray-300 peer-checked:text-white">
                                        <span class="font-bold font-heading text-magic-gold/70">${labels[optIndex]}.</span>
                                        <span>${opt}</span>
                                    </div>
                                </div>
                            </label>
                    `;
                });

                questionsHTML += `
                        </div>
                    </div>
                `;
            });

            questionsContainer.innerHTML = questionsHTML;

            // Switch views
            welcomeScreen.classList.add('hidden');
            examContainer.classList.remove('hidden');
            
            // Close menu on mobile after selection
            if(window.innerWidth < 1024) toggleMenu();
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        examForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (isExamSubmitted) return;
            
            let score = 0;
            const totalQuestions = currentExam.questions.length;
            const formData = new FormData(examForm);

            // Check answers
            currentExam.questions.forEach((q, index) => {
                const selectedValue = formData.get(`q_${index}`);
                const card = document.getElementById(`question-card-${index}`);
                const labels = card.querySelectorAll('label > div'); // The visual container
                
                // Disable all inputs
                card.querySelectorAll('input[type="radio"]').forEach(input => input.disabled = true);

                if (selectedValue !== null) {
                    const selectedInt = parseInt(selectedValue);
                    
                    if (selectedInt === q.answer) {
                        score++;
                        // Highlight correct selection visually
                        labels[selectedInt].classList.add('correct-answer');
                    } else {
                        // Highlight wrong selection
                        labels[selectedInt].classList.add('wrong-answer');
                        // Show what the right answer was
                        labels[q.answer].classList.add('correct-answer');
                    }
                } else {
                     // If somehow not selected (though required attribute should prevent this), show correct
                     labels[q.answer].classList.add('correct-answer');
                }
            });

            // Calculate final grade
            const percentage = Math.round((score / totalQuestions) * 100);
            let gradeLetter = 'T'; // Troll (Fail)
            if (percentage >= 90) gradeLetter = 'O'; // Outstanding
            else if (percentage >= 70) gradeLetter = 'E'; // Exceeds Expectations
            else if (percentage >= 50) gradeLetter = 'A'; // Acceptable
            else if (percentage >= 30) gradeLetter = 'P'; // Poor
            else if (percentage >= 15) gradeLetter = 'D'; // Dreadful

            // Display results
            submitBtn.classList.add('hidden');
            scoreDisplay.classList.remove('hidden');
            scoreDisplay.innerHTML = `
                Nilai Anda: <span class="text-magic-gold text-4xl ml-2">${percentage} / 100</span>
                <div class="text-lg text-gray-400 mt-2 font-body">Peringkat N.E.W.T: <strong class="text-white">${gradeLetter}</strong></div>
            `;
            
            isExamSubmitted = true;
            
            // Scroll to bottom to see score
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });

        window.addEventListener('DOMContentLoaded', () => {
            initNavigation();
        });
    </script>
