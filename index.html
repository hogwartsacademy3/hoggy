<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeker Quidditch Hogwarts Institute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.05), transparent 25%);
            font-family: 'Lora', serif;
            color: #e2e8f0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1, h2 {
            font-family: 'Cinzel', serif;
        }

        .magical-border {
            border: 2px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3), inset 0 0 15px rgba(212, 175, 55, 0.2);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }

        /* Animasi melayang untuk Golden Snitch */
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }

        .snitch-image {
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.6));
        }

        /* Animasi masuk untuk halaman sukses */
        @keyframes reveal {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .reveal-anim {
            animation: reveal 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Styling Input Tanpa Clue */
        .secret-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #475569;
            color: #d4af37;
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 0.5em;
            transition: all 0.3s ease;
        }

        .secret-input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* Animasi guncangan saat salah kode */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.5s;
        }
    </style>
</head>
<body>

    <!-- HALAMAN 1: GERBANG PELINDUNG -->
    <div id="gate-section" class="w-full max-w-md p-8 rounded-xl magical-border text-center transition-all duration-700 mx-4">
        <h1 class="text-3xl md:text-4xl font-bold text-[#d4af37] mb-2 tracking-wide">Hogwarts</h1>
        <h2 class="text-lg md:text-xl text-gray-400 mb-8 uppercase tracking-widest">Seeker Quidditch Institute</h2>
        
        <p class="text-sm text-gray-400 mb-6 italic">Akses dibatasi. Masukkan kode identifikasi.</p>

        <div class="flex flex-col gap-4">
            <!-- Input dikosongkan dari placeholder/clue bentuk apapun -->
            <input 
                type="password" 
                id="secret-code" 
                class="secret-input w-full p-4 rounded-lg"
                autocomplete="off"
            >
            
            <button 
                onclick="checkCode()" 
                class="w-full py-3 rounded-lg bg-[#d4af37] hover:bg-[#b8952b] text-gray-900 font-bold uppercase tracking-wider transition-colors"
            >
                Buka Gerbang
            </button>
        </div>

        <p id="error-message" class="text-red-500 mt-4 h-6 opacity-0 transition-opacity italic text-sm">Kode pelindung menolak akses Anda.</p>
    </div>


    <!-- HALAMAN 2: SUCCESS / GOLDEN SNITCH -->
    <div id="success-section" class="hidden w-full max-w-2xl p-8 rounded-xl text-center mx-4 flex-col items-center justify-center">
        
        <div class="mb-10 mt-4 relative w-64 h-64 mx-auto flex items-center justify-center">
            <!-- Gambar Golden Snitch melayang -->
            <img 
                src="https://upload.wikimedia.org/wikipedia/commons/6/69/Golden_Snitch_%28representation%29.png" 
                alt="Golden Snitch" 
                class="snitch-image w-full object-contain"
            >
        </div>

        <div class="magical-border p-8 rounded-lg relative overflow-hidden bg-opacity-90 bg-gray-900">
            <h1 class="text-3xl font-bold text-[#d4af37] mb-6">150 Poin!</h1>
            <p class="text-xl md:text-2xl leading-relaxed text-gray-200">
                Selamat, anda berhasil menangkap snitch. Wasit akan segera mengumumkan bahwa snitch berhasil ditangkap
            </p>
        </div>

    </div>

    <script>
        const inputField = document.getElementById('secret-code');
        
        // Memungkinkan user menekan tombol Enter untuk mensubmit
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkCode();
            }
        });

        function checkCode() {
            const code = inputField.value;
            const gateSection = document.getElementById('gate-section');
            const successSection = document.getElementById('success-section');
            const errorMessage = document.getElementById('error-message');

            if (code === "66") {
                // Kode Benar
                errorMessage.classList.remove('opacity-100');
                
                // Efek transisi menghilang
                gateSection.style.opacity = '0';
                gateSection.style.transform = 'scale(0.9)';
                
                setTimeout(() => {
                    gateSection.classList.add('hidden');
                    
                    // Tampilkan halaman success
                    successSection.classList.remove('hidden');
                    successSection.classList.add('flex', 'reveal-anim');
                }, 500); // Tunggu transisi selesai

            } else {
                // Kode Salah
                errorMessage.classList.add('opacity-100');
                gateSection.classList.add('shake');
                
                // Hapus class shake setelah animasi selesai agar bisa diulang
                setTimeout(() => {
                    gateSection.classList.remove('shake');
                }, 500);

                // Kosongkan input lagi
                inputField.value = "";
            }
        }
    </script>
</body>
</html>
